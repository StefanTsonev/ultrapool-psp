name: Host checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake --target core_tests -j2
      - run: ctest --test-dir build/cmake --output-on-failure
      - run: python -m unittest discover -s tests -p 'test_public*.py'
